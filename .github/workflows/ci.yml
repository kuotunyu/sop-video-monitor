name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-312:
    name: Python 3.12 lint + tests + reproduce-lite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Action SHAs reused from the owner's WoundScope ci.yml (same pins, same versions).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The `baseline` dependency group (torch, PyAV) is deliberately not installed here:
      # CI must stay data-free and GPU-free. Tests needing PyAV skip themselves.
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Recompute every committed run's metrics from its prediction table and check tables.md.
      - run: uv run sop-monitor reproduce-lite
      # Recompute the frozen test-list hashes from the committed split CSVs (spec 4.1).
      - run: uv run sop-monitor verify-splits --directory splits/industreal
      - run: uv run sop-monitor verify-splits --directory splits/ha-vid
      # TODO: add the ignored-directory scan (no source code under data/, artifacts/) per spec 3.3.
