[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sop-video-monitor"
version = "0.0.1"
description = "Multi-camera SOP sequence monitoring on HA-ViD: streaming decode, online step segmentation, precedence-graph checks, human review. W0 skeleton."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "kuotunyu" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]
# Heavy, data-path-only dependencies live in the `baseline` dependency group below so that
# CI (`uv sync --all-extras --frozen`) never installs torch. Still planned, not yet added:
#   W2-W3 heads       : causal MS-TCN++, ASFormer, late fusion (torch, already in `baseline`)
#   W4 streaming      : mediamtx is a binary, not pip; PyAV is already in `baseline`
#   W5 review / VLM   : fastapi, uvicorn, python-multipart; vllm or transformers for Qwen3-VL-8B
#   W6 reports        : matplotlib, scipy

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
sop-monitor = "sop_monitor.cli:app"

# Video decode + frozen DINOv2 frame features + linear head (IndustReal development baseline).
# Install with `uv sync --all-extras --group baseline`; torch/torchvision come from the CUDA 13.0
# index on Linux/Windows (same pins as mvtec-ad2-inspection-platform) and from PyPI elsewhere.
[dependency-groups]
baseline = [
  "av>=18.1,<19",
  "torch==2.13.0",
  "torchvision==0.28.0",
]
figures = [
    "manim>=0.19",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/sop_monitor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
